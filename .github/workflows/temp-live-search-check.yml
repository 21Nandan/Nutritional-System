name: Temporary live search check

on:
  push:
    branches: [claude/sleepy-franklin-rxra0a]
    paths: ['.github/workflows/temp-live-search-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rank real search results
        shell: python
        run: |
          import sys; sys.path.insert(0, ".")
          from backend.core.off_catalogue import browse_catalogue, alternative_candidates
          from backend.core.openfoodfacts import search_openfoodfacts_text
          from backend.core.product_quality import rank_products
          for q in ["cadbury", "cadbury da", "dairy milk", "Cadbury Dairy Milk", "maggi", "parle g", "kurkure", "haldiram bhujia", "amul butter", "britania", "zzqqxxwv", ""]:
              r = browse_catalogue(text=q)
              print("==== catalogue", repr(q), r["status"], "| mode", r.get("match_mode"), "| count", r.get("count"), "| pool", r.get("searched_pool"), "| removed", r.get("removed"))
              for p in r.get("products", [])[:5]:
                  print("    ", p["search_relevance"] if "search_relevance" in p else "-", p.get("data_completeness_score"), "|", p["product_name"], "|", p["brand"], "| india", p.get("sold_in_india"))
          for q in ["ice cream", "nutella", "kurkure"]:
              raw = search_openfoodfacts_text(q, limit=100)
              ranked, removed = rank_products(raw["products"], q)
              print("==== product search", q, "| raw", len(raw["products"]), "| kept", len(ranked), "| removed", removed)
              for p in ranked[:4]:
                  print("    ", p["search_relevance"], p["data_completeness_score"], "|", p["product_name"], "|", p["brand"], "| india", p.get("sold_in_india"))
          alt = alternative_candidates({"category": "Snacks", "barcode": "x"})
          print("==== alternatives Snacks", alt["status"], len(alt["products"]))
