name: Post-deploy smoke test

# Runs after Vercel reports a successful deployment, and on demand.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL
        required: true
        default: https://eatgood26.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
