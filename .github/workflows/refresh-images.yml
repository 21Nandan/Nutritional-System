name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check the catalogue queries against the live search service (temporary)
        shell: python
        run: |
          import sys; sys.path.insert(0, ".")
          from backend.core.off_catalogue import browse_catalogue, build_catalogue_query, alternative_candidates
          from backend.core.openfoodfacts import search_openfoodfacts_text
          cases = [
            ("browse india", {}),
            ("browse world", {"india_only": False}),
            ("snacks", {"category": "Snacks"}),
            ("biscuits", {"category": "Biscuits & Bakery"}),
            ("chocolates", {"category": "Chocolates & Sweets"}),
            ("instant", {"category": "Instant Foods"}),
            ("dairy", {"category": "Dairy"}),
            ("condiments", {"category": "Condiments & Spreads"}),
            ("beverages", {"category": "Packaged Beverages"}),
            ("cereals", {"category": "Breakfast Cereals"}),
            ("text maggi", {"text": "maggi"}),
            ("text lay's (salted)", {"text": "lay's (salted)"}),
            ("text world nutella", {"text": "nutella", "india_only": False}),
            ("sugar<=10 sodium<=400 satfat<=4", {"nutrient_filters": {"max_sugars": 10, "max_sodium": 400, "max_sat_fat": 4}}),
            ("fibre>=3 protein>=7", {"nutrient_filters": {"min_fibre": 3, "min_protein": 7}}),
            ("photos", {"has_image": True}),
            ("intent low sugar biscuits", {"text": "low sugar biscuits"}),
            ("intent snacks without peanuts", {"text": "high protein snacks without peanuts"}),
            ("page 3", {"page": 3}),
          ]
          for name, kw in cases:
              q, _ = build_catalogue_query(kw.get("text", ""), kw.get("category", "All"), kw.get("india_only", True), kw.get("nutrient_filters"), kw.get("has_image", False))
              r = browse_catalogue(**kw)
              print("====", name, "|", r["status"], "| count", r.get("count"), "| n", len(r.get("products", [])), "|", r.get("error_code") or "", "| intent", r.get("interpreted_intent"))
              print("   query:", q)
              for p in r.get("products", [])[:4]:
                  print("   ", p["product_id"], "|", p["product_name"], "|", p["brand"], "|", p["category"], "/", p["sub_category"], "| kcal", p["energy_kcal"], "| sug", p["sugars_g"], "| na", p["sodium_mg"], "| img", bool(p.get("image_small_url")))
          for cat_product in [{"category": "Snacks", "barcode": "1"}, {"category": "Packaged Beverages", "barcode": "1"}]:
              r = alternative_candidates(cat_product)
              print("==== alternatives", cat_product["category"], r["status"], len(r["products"]), [p["product_name"] for p in r["products"][:5]])
          r = search_openfoodfacts_text("kurkure", limit=5)
          print("==== text search kurkure", r["status"], r.get("count"))
