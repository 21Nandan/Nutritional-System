name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: pip install httpx
      - name: Probe Open Food Facts product API (temporary)
        shell: python
        run: |
          import httpx
          c = httpx.Client(headers={"User-Agent": "EATGOOD/1.1 (+https://github.com/21Nandan/Nutritional-System)"}, timeout=20)
          for code in ["8901491103084", "8901491367219", "3850116007328"]:
              r = c.get(f"https://world.openfoodfacts.org/api/v3/product/{code}", params={"fields": "code,product_name,brands,nutriments"})
              print("====", code, r.status_code, r.elapsed.total_seconds(), r.text[:300])
