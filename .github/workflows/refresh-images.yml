name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: pip install httpx
      - name: Probe search syntax for partial words, barcodes and ingredients (temporary)
        shell: python
        run: |
          import httpx
          c = httpx.Client(headers={"User-Agent": "EATGOOD/1.1 (+https://github.com/21Nandan/Nutritional-System)"}, timeout=25)
          IN = 'countries_tags:"en:india"'
          NC = "nutriments.energy-kcal_100g:[0 TO 1000]"
          F = "code,product_name,brands"
          qs = {
            "dairy +filters": f"dairy AND {IN} AND {NC}",
            "milk +filters": f"milk AND {IN} AND {NC}",
            "dairy milk (none)": "dairy milk",
            "dairy milk +IN only": f"dairy milk AND {IN}",
            "(dairy milk) +filters": f"(dairy milk) AND {IN} AND {NC}",
            "filters first then words": f"{IN} AND {NC} AND dairy milk",
            "implicit words + filters": f"dairy milk {IN} {NC}",
            "cadbury dairy +filters": f"cadbury dairy AND {IN} AND {NC}",
            "parle +filters": f"parle AND {IN} AND {NC}",
            "parle g (none)": "parle g",
            "product_name:dairy +IN": f"product_name:dairy AND {IN}",
            "cadbury da* (none)": "cadbury da*",
            "dairy mi* (none)": "dairy mi*",
            "dairy milk silk (none)": "dairy milk silk",
          }
          for name, q in qs.items():
              r = c.get("https://search.openfoodfacts.org/search", params={"q": q, "page_size": 6, "fields": F, "langs": "en"})
              try:
                  b = r.json()
              except Exception:
                  b = {}
              hits = b.get("hits") or []
              print("====", name, "|", r.status_code, "| count", b.get("count"), "|", str(b.get("detail") or "")[:200])
              for h in hits[:4]:
                  print("    ", h.get("code"), "|", h.get("product_name"), "|", h.get("brands"))
