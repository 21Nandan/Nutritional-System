name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check catalogue search against the live search service (temporary)
        shell: python
        run: |
          import sys; sys.path.insert(0, ".")
          from backend.core.off_catalogue import browse_catalogue
          cases = [
            ("cadbury", {"text": "cadbury"}),
            ("cadbury da", {"text": "cadbury da"}),
            ("dairy milk", {"text": "dairy milk"}),
            ("Cadbury Dairy Milk", {"text": "Cadbury Dairy Milk"}),
            ("  CADBURY   ", {"text": "  CADBURY   "}),
            ("cadb", {"text": "cadb"}),
            ("barcode", {"text": "8901233030548"}),
            ("parle g", {"text": "parle g"}),
            ("lay's", {"text": "lay's"}),
            ("haldiram bhujia", {"text": "haldiram bhujia"}),
            ("maggi + Instant Foods", {"text": "maggi", "category": "Instant Foods"}),
            ("cadbury + Chocolates", {"text": "cadbury", "category": "Chocolates & Sweets"}),
            ("cadbury + sugar<=10", {"text": "cadbury", "nutrient_filters": {"max_sugars": 10}}),
            ("dairy milk + photos", {"text": "dairy milk", "has_image": True}),
            ("low sugar biscuits", {"text": "low sugar biscuits"}),
            ("nonsense", {"text": "zzqqxxwv"}),
            ("browse all filters", {"nutrient_filters": {"max_sugars": 10, "max_sodium": 400, "max_sat_fat": 4, "min_fibre": 3, "min_protein": 7}}),
            ("browse page 2", {"page": 2}),
            ("nutella world", {"text": "nutella", "india_only": False}),
          ]
          for name, kw in cases:
              r = browse_catalogue(**kw)
              print("====", name, "|", r["status"], "| mode", r.get("match_mode"), "| count", r.get("count"), "| n", len(r.get("products", [])), "| pool", r.get("searched_pool"), "|", r.get("error_code") or "")
              for p in r.get("products", [])[:4]:
                  print("   ", p["product_id"], "|", p["product_name"], "|", p["brand"], "|", p["category"])
