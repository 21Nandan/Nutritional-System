name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: pip install httpx
      - name: Probe search syntax for partial words, barcodes and ingredients (temporary)
        shell: python
        run: |
          import httpx
          c = httpx.Client(headers={"User-Agent": "EATGOOD/1.1 (+https://github.com/21Nandan/Nutritional-System)"}, timeout=25)
          IN = 'countries_tags:"en:india"'
          NC = "nutriments.energy-kcal_100g:[0 TO 1000]"
          F = "code,product_name,brands"
          qs = {
            "cadbury": f"cadbury AND {IN} AND {NC}",
            "Cadbury caps": f"Cadbury AND {IN} AND {NC}",
            "cadbury da* (no AND)": f"cadbury da* AND {IN} AND {NC}",
            "cadbury AND da*": f"cadbury AND da* AND {IN} AND {NC}",
            "(cadbury da*)": f"(cadbury AND da*) AND {IN} AND {NC}",
            "cadb*": f"cadb* AND {IN} AND {NC}",
            "dairy milk": f"dairy milk AND {IN} AND {NC}",
            "(dairy AND milk)": f"(dairy AND milk) AND {IN} AND {NC}",
            "\"dairy milk\" phrase": f'"dairy milk" AND {IN} AND {NC}',
            "code exact": 'code:"8901233030548"',
            "code digits as text": "8901233030548",
            "ingredients_text cocoa": f"ingredients_text:cocoa AND {IN} AND {NC}",
            "ingredients_text_en cocoa": f"ingredients_text_en:cocoa AND {IN} AND {NC}",
            "ingredients.text cocoa": f"ingredients_text.en:cocoa AND {IN} AND {NC}",
            "maggi": f"maggi AND {IN} AND {NC}",
            "mag*": f"mag* AND {IN} AND {NC}",
            "parle g": f"parle g AND {IN} AND {NC}",
            "(parle AND g*)": f"(parle AND g*) AND {IN} AND {NC}",
          }
          for name, q in qs.items():
              r = c.get("https://search.openfoodfacts.org/search", params={"q": q, "page_size": 4, "fields": F, "langs": "en"})
              try:
                  b = r.json()
              except Exception:
                  b = {}
              hits = b.get("hits") or []
              print("====", name, "|", r.status_code, "| count", b.get("count"), "|", str(b.get("detail") or "")[:200])
              for h in hits[:4]:
                  print("    ", h.get("code"), "|", h.get("product_name"), "|", h.get("brands"))
