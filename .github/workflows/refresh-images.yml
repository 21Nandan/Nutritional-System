name: Refresh product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: pip install httpx
      - name: Probe Open Food Facts search capabilities (temporary)
        shell: python
        run: |
          import httpx, json
          c = httpx.Client(headers={"User-Agent": "EATGOOD/1.1 (+https://github.com/21Nandan/Nutritional-System)"}, timeout=25)
          F = "code,product_name,brands,categories_tags,countries_tags,unique_scans_n,nutriments,image_front_small_url"
          IN = 'countries_tags:"en:india"'
          NC = 'states_tags:"en:nutrition-facts-completed"'
          tests = {
            "india_nutrition_complete": {"q": f'{IN} AND {NC}', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F},
            "range_sugar_lte5": {"q": f'{IN} AND {NC} AND nutriments.sugars_100g:<=5', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F + ",nutriments"},
            "range_sugar_bracket": {"q": f'{IN} AND {NC} AND nutriments.sugars_100g:[0 TO 5]', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F},
            "range_sodium": {"q": f'{IN} AND {NC} AND nutriments.sodium_100g:[0 TO 0.4]', "page_size": 3, "fields": F},
            "or_group": {"q": f'{IN} AND (categories_tags:"en:chocolates" OR categories_tags:"en:confectioneries")', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F},
            "not_alcohol": {"q": f'{IN} AND categories_tags:"en:beverages" AND NOT categories_tags:"en:alcoholic-beverages"', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F},
            "salty_snacks": {"q": f'{IN} AND {NC} AND categories_tags:"en:salty-snacks"', "sort_by": "-unique_scans_n", "page_size": 5, "fields": F},
            "text_kurkure_world": {"q": "kurkure", "page_size": 3, "fields": F},
            "text_with_filters": {"q": f'bhujia AND {IN}', "page_size": 3, "fields": F},
            "has_image": {"q": f'{IN} AND {NC} AND _exists_:image_front_small_url', "page_size": 3, "fields": F},
          }
          for name, params in tests.items():
              try:
                  r = c.get("https://search.openfoodfacts.org/search", params=params)
                  body = r.json() if "json" in r.headers.get("content-type", "") else {}
                  hits = body.get("hits") or []
                  print("====", name, r.status_code, round(r.elapsed.total_seconds(), 2), "count", body.get("count"), "page_count", body.get("page_count"), "err", str(body.get("detail") or body.get("errors") or "")[:300])
                  for h in hits[:5]:
                      n = h.get("nutriments") or {}
                      print("   ", h.get("code"), "|", h.get("product_name"), "|", h.get("brands"), "|", (h.get("categories_tags") or [])[-2:], "| india" if "en:india" in (h.get("countries_tags") or []) else "| -", "| scans", h.get("unique_scans_n"), "| kcal", n.get("energy-kcal_100g"), "| img", bool(h.get("image_front_small_url")))
              except Exception as e:
                  print("====", name, "EXC", repr(e))
