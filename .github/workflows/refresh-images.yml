name: Refresh product images

# Looks up current production Open Food Facts photo URLs for data/product_images.csv.
# The refreshed CSV is printed in the log and uploaded as an artifact for review;
# nothing is committed automatically.
on:
  workflow_dispatch:
  push:
    branches: [claude/sleepy-franklin-rxra0a]
    paths: [scripts/refresh_product_images.py, .github/workflows/refresh-images.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: python scripts/refresh_product_images.py
      - name: Print refreshed CSV
        run: |
          echo "----- BEGIN product_images.csv -----"
          cat data/product_images.csv
          echo "----- END product_images.csv -----"
      - uses: actions/upload-artifact@v7
        with:
          name: product_images
          path: data/product_images.csv
