[project]
name = "eatgood"
version = "1.1.0"
description = "Nutrition grading, personal suitability and allergen checks for Indian packaged foods."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "certifi>=2024.2.2",
]

[dependency-groups]
dev = [
    "uvicorn>=0.30",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.uv]
# The app is deployed from source, not installed as a package.
package = false
# Copy instead of hard-linking: build caches and site-packages are on different devices in CI and on Vercel.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S"]
"data/quarantine/*" = ["S311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["backend", "api"]
exclude = ["backend/tests/"]
